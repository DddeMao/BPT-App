<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>БПТ (Будни против творчества)</title>
  <link rel="icon" href="logo.png" type="image/png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Оверлей загрузки -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <div id="loadingText"></div>
  </div>

<div id="app" style="display:none;">
    <header class="top-nav">
        <div class="logo">БПТ</div>
        <button id="settingsBtn" class="btn-settings">⚙️</button>
    </header>

    <main id="content"></main>

    <div id="floatingPlayer" class="player-island">
        <div class="mini-player-info">
            <span id="miniTitle">Ничего не играет</span>
        </div>
        <button id="playPauseBtn" onclick="togglePlay()">▶</button>
    </div>

    <nav class="bottom-nav">
        <button onclick="navigate('home')">🏠</button>
        <button onclick="navigate('albums')">💿</button>
        <button onclick="navigate('search')">🔍</button>
    </nav>
</div>

<script src="router.js"></script>
<script src="app.js"></script>
</body>
</html>
